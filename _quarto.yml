project:
  type: website
  output-dir: docs
  resources:
    - files/**
    # GitHub Pages reads the custom domain from a CNAME file in the published
    # folder. It must be listed here so every render re-emits docs/CNAME —
    # otherwise a render wipes it and the custom domain silently detaches.
    - CNAME

website:
  title: "Jonas Heering"
  description: "Jonas Heering — PhD Candidate in International Relations, Georgetown University. Research on state-business relations in the digital economy and the political power of digital platform companies."
  # Must match the host the site is actually served from. Quarto uses this to
  # build sitemap/Open Graph URLs and to decide which links are "external".
  # Paired with the CNAME resource above.
  site-url: https://jonasheering.com
  open-graph: true
  twitter-card: true

format:
  html:
    theme:
      - cosmo
      - custom.scss
    page-layout: custom
    toc: false
    anchor-sections: false
    link-external-newwindow: true
    include-after-body: scrollspy.html
