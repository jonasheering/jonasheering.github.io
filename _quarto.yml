project:
  type: website
  output-dir: docs
  resources:
    - files/**

website:
  title: "Jonas Heering"
  description: "Jonas Heering — PhD Candidate in International Relations, Georgetown University. Research on state-business relations in the digital economy and the political power of digital platform companies."
  # Must match the host the site is actually served from. Quarto uses this to
  # build sitemap/Open Graph URLs and to decide which links are "external".
  # When jonasheering.com is attached as a custom domain, change this to
  # https://jonasheering.com and add a CNAME file (see docs/CNAME).
  site-url: https://jonasheering.github.io
  open-graph: true
  twitter-card: true

format:
  html:
    theme:
      - cosmo
      - custom.scss
    page-layout: custom
    toc: false
    anchor-sections: false
    link-external-newwindow: true
    include-after-body: scrollspy.html
